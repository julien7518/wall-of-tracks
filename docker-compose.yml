services:
  app:
    build: .
    image: afterglow-constellation:latest
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
      LASTFM_USERNAME: ${LASTFM_USERNAME:-jojjjjoooooooo}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
